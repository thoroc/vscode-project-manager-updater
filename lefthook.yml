pre-commit:
  commands:
    fmt:
      glob: "*.{rs}"
      run: cargo fmt --all -- --check
      stage_fixed: true
    clippy:
      glob: "*.{rs}"
      run: cargo clippy --all-targets --all-features -- -D warnings
      stage_fixed: true
    markdownlint:
      glob: "*.md"
      run: markdownlint-cli2 --fix {staged_files}
      stage_fixed: true

pre-push:
  commands:
    test:
      run: cargo test
