[package]
name = "vscode-pmu"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vscode-pmu"
path = "src/main.rs"

[dependencies]
clap                  = { version = "4.5", features = ["derive"] }
anyhow                = "1.0"
serde                 = { version = "1.0", features = ["derive"] }
serde_json            = "1.0"
walkdir               = "2.5"
notify                = "6.1"
notify-debouncer-mini = "0.4"
dirs                  = "5.0"
chrono                = { version = "0.4", features = ["clock"] }
dialoguer             = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip         = true
opt-level     = "z"
lto           = true
codegen-units = 1
